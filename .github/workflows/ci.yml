name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: fai_control_plane
          POSTGRES_USER: fai
          POSTGRES_PASSWORD: fai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fai -d fai_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://fai:fai@127.0.0.1:5432/fai_control_plane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate migration history
        run: pnpm db:check

      - name: Detect schema drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git ls-files --others --exclude-standard packages/db/drizzle)"

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
