name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: fai_control_plane_mvp
          POSTGRES_USER: fai
          POSTGRES_PASSWORD: fai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fai -d fai_control_plane_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://fai:fai@127.0.0.1:5432/fai_control_plane_mvp
      FCP_WORKSPACE_ID: 10000000-0000-4000-8000-000000000001
      FCP_PROJECT_ID: 10000000-0000-4000-8000-000000000002
      GITHUB_BINDING_ID: 10000000-0000-4000-8000-000000000003
      BOOTSTRAP_OWNER_ACTOR_ID: 10000000-0000-4000-8000-000000000004
      BOOTSTRAP_TRACKER_SECRET_REF_ID: 10000000-0000-4000-8000-000000000005
      BOOTSTRAP_WORKSPACE_SLUG: ci
      BOOTSTRAP_WORKSPACE_NAME: CI
      BOOTSTRAP_PROJECT_SLUG: ascon
      BOOTSTRAP_PROJECT_NAME: ASCON
      BOOTSTRAP_OWNER_NAME: CI Owner
      BOOTSTRAP_OWNER_GITHUB_USER_ID: "1"
      BOOTSTRAP_REPOSITORY_URL: https://github.com/VF78/ascon
      BOOTSTRAP_REPOSITORY_ID: VF78/ascon
      BOOTSTRAP_GITHUB_PROJECT_URL: https://github.com/users/VF78/projects/1
      GITHUB_PROJECT_ID: PVT_ci
      GITHUB_PROJECTS_TOKEN_FILE: /run/secrets/github-projects-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Fresh 16-table baseline and idempotent bootstrap
        run: |
          pnpm db:migrate
          pnpm mvp:bootstrap
          pnpm mvp:bootstrap
          pnpm db:check
      - run: pnpm test

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit secret mounts and fresh-MVP services
        shell: bash
        run: |
          set -Eeuo pipefail
          secret_dir="$RUNNER_TEMP/fcp-secrets"
          mkdir -p "$secret_dir"
          for name in postgres github-login github-projects github-webhook hermes bitrix-app bitrix-rest telegram; do
            printf 'ci-placeholder\n' > "$secret_dir/$name"
          done
          export POSTGRES_DB=fai_control_plane_mvp POSTGRES_USER=fai
          export POSTGRES_PASSWORD_FILE="$secret_dir/postgres"
          export GITHUB_LOGIN_CLIENT_SECRET_HOST_FILE="$secret_dir/github-login"
          export GITHUB_PROJECTS_TOKEN_HOST_FILE="$secret_dir/github-projects"
          export GITHUB_WEBHOOK_SECRET_HOST_FILE="$secret_dir/github-webhook"
          export HERMES_TOKEN_HOST_FILE="$secret_dir/hermes"
          export BITRIX24_APPLICATION_TOKEN_HOST_FILE="$secret_dir/bitrix-app"
          export BITRIX24_REST_TOKEN_HOST_FILE="$secret_dir/bitrix-rest"
          export TELEGRAM_BOT_TOKEN_HOST_FILE="$secret_dir/telegram"
          cp .env.example .env
          docker compose --profile bootstrap config --quiet
          rendered=$(docker compose --profile bootstrap config --services | sort)
          expected=$(printf '%s\n' bootstrap migrate postgres web worker | sort)
          test "$rendered" = "$expected"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
