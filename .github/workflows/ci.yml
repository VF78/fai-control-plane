name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: fai_control_plane
          POSTGRES_USER: fai
          POSTGRES_PASSWORD: fai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fai -d fai_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://fai:fai@127.0.0.1:5432/fai_control_plane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate migration history
        run: pnpm db:check

      - name: Detect schema drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git ls-files --others --exclude-standard packages/db/drizzle)"

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: fai-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: 55432
      WEB_PORT: 53000
      WORKER_PORT: 53001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose smoke test
        shell: bash
        run: |
          set -Eeuo pipefail

          diagnostics() {
            docker compose ps --all || true
            docker compose logs --no-color || true
          }

          cleanup() {
            docker compose down --volumes --remove-orphans || true
          }

          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              diagnostics
            fi
            cleanup
            exit "$status"
          }

          wait_for_health() {
            local service=$1
            local deadline=$((SECONDS + 90))
            local container

            container=$(docker compose ps -q "$service")
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "Timed out waiting for $service to become healthy" >&2
                return 1
              fi
              sleep 2
            done
          }

          wait_for_endpoint() {
            local name=$1
            local url=$2
            local expected=$3
            local deadline=$((SECONDS + 120))
            local body

            while true; do
              body=$(curl --fail --silent --show-error --max-time 3 "$url" || true)
              if printf '%s' "$body" | grep --fixed-strings --quiet "$expected"; then
                return 0
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "Timed out waiting for $name at $url; last response: $body" >&2
                return 1
              fi
              sleep 2
            done
          }

          trap on_exit EXIT

          docker compose build
          docker compose up -d postgres
          wait_for_health postgres
          docker compose up --no-deps --abort-on-container-exit --exit-code-from migrate migrate
          docker compose up -d web worker
          wait_for_endpoint web "http://127.0.0.1:${WEB_PORT}/api/ready" '"status":"ready"'
          wait_for_endpoint worker-health "http://127.0.0.1:${WORKER_PORT}/health" '"status":"ok"'
          wait_for_endpoint worker-ready "http://127.0.0.1:${WORKER_PORT}/ready" '"status":"ready"'

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
