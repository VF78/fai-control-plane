name: fai-control-plane-mvp
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?required}"
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-mvp-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: {context: ., dockerfile: infra/compose/Dockerfile, target: runtime}
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "packages/db/dist/migrate.js"]
    environment: &database-environment {PGHOST: postgres, PGPORT: "5432", PGUSER: "${POSTGRES_USER:?required}", PGDATABASE: "${POSTGRES_DB:?required}"}
    secrets: [postgres-password]
    depends_on: {postgres: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: infra/compose/Dockerfile, target: runtime}
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "apps/web/.next/standalone/apps/web/server.js"]
    env_file: [.env]
    environment:
      <<: *database-environment
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports: ["${WEB_PORT:-3000}:3000"]
    secrets: [postgres-password, github-login-client-secret, github-projects-token, github-webhook-secret, hermes-internal-action-token, hermes-client-action-token]
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    build: {context: ., dockerfile: infra/compose/Dockerfile, target: runtime}
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "apps/worker/dist/index.js"]
    env_file: [.env]
    environment:
      <<: *database-environment
      PORT: "3001"
    ports: ["${WORKER_PORT:-3001}:3001"]
    secrets: [postgres-password, github-projects-token, hermes-token, telegram-bot-token]
    depends_on: {migrate: {condition: service_completed_successfully}}
  bootstrap:
    profiles: [bootstrap]
    build: {context: ., dockerfile: infra/compose/Dockerfile, target: runtime}
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "packages/db/dist/bootstrap.js"]
    env_file: [.env]
    environment: *database-environment
    secrets: [postgres-password, github-projects-token]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  postgres-mvp-data:
secrets:
  postgres-password: {file: "${POSTGRES_PASSWORD_FILE:?required}"}
  github-login-client-secret: {file: "${GITHUB_LOGIN_CLIENT_SECRET_HOST_FILE:?required}"}
  github-projects-token: {file: "${GITHUB_PROJECTS_TOKEN_HOST_FILE:?required}"}
  github-webhook-secret: {file: "${GITHUB_WEBHOOK_SECRET_HOST_FILE:?required}"}
  hermes-token: {file: "${HERMES_TOKEN_HOST_FILE:?required}"}
  telegram-bot-token: {file: "${TELEGRAM_BOT_TOKEN_HOST_FILE:?required}"}
  hermes-internal-action-token: {file: "${HERMES_INTERNAL_ACTION_TOKEN_HOST_FILE:?required}"}
  hermes-client-action-token: {file: "${HERMES_CLIENT_ACTION_TOKEN_HOST_FILE:?required}"}
