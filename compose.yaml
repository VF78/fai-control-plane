name: fai-control-plane

x-runtime-environment: &runtime-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://fai:fai@postgres:5432/fai_control_plane}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-fai-control-plane}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  GITHUB_SYNC_ENABLED: ${GITHUB_SYNC_ENABLED:-false}
  GITHUB_INGRESS_ENABLED: ${GITHUB_INGRESS_ENABLED:-false}
  GITHUB_STATUS_WRITEBACK_ENABLED: ${GITHUB_STATUS_WRITEBACK_ENABLED:-false}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-/run/secrets/github-app-private-key}
  GITHUB_WEBHOOK_SECRET_FILE: ${GITHUB_WEBHOOK_SECRET_FILE:-/run/secrets/github-webhook}
  FCP_WORKSPACE_ID: ${FCP_WORKSPACE_ID:-}
  GITHUB_MSA_PROJECT_ID: ${GITHUB_MSA_PROJECT_ID:-}
  GITHUB_MSA_INSTALLATION_ID: ${GITHUB_MSA_INSTALLATION_ID:-}
  GITHUB_ASCON_PROJECT_ID: ${GITHUB_ASCON_PROJECT_ID:-}
  GITHUB_ASCON_INSTALLATION_ID: ${GITHUB_ASCON_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY_HOST_FILE: ${GITHUB_APP_PRIVATE_KEY_HOST_FILE:-./infra/compose/secrets/github-app-private-key.disabled}
  TELEGRAM_INGRESS_ENABLED: ${TELEGRAM_INGRESS_ENABLED:-false}
  TELEGRAM_STATUS_RESPONSE_ENABLED: ${TELEGRAM_STATUS_RESPONSE_ENABLED:-false}
  TELEGRAM_WEBHOOK_SECRET_FILE: ${TELEGRAM_WEBHOOK_SECRET_FILE:-/run/secrets/telegram-webhook}
  TELEGRAM_IDENTITY_SECRET_FILE: ${TELEGRAM_IDENTITY_SECRET_FILE:-/run/secrets/telegram-identity}
  TELEGRAM_BOT_TOKEN_FILE: ${TELEGRAM_BOT_TOKEN_FILE:-/run/secrets/telegram-bot-token}
  TELEGRAM_PROJECT_ID: ${TELEGRAM_PROJECT_ID:-}
  TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
  TELEGRAM_ALLOWED_PRIVATE_CHAT_IDS: ${TELEGRAM_ALLOWED_PRIVATE_CHAT_IDS:-}
  RUNNER_ENABLED: ${RUNNER_ENABLED:-false}
  RUNNER_NETWORK_MODE: ${RUNNER_NETWORK_MODE:-none}
  ARTIFACTS_ROOT: ${ARTIFACTS_ROOT:-/var/lib/fai/artifacts}
  LOCAL_RUNNER_TRANSPORT_ENABLED: ${LOCAL_RUNNER_TRANSPORT_ENABLED:-false}
  LOCAL_RUNNER_WORKSPACE_ID: ${LOCAL_RUNNER_WORKSPACE_ID:-}
  LOCAL_RUNNER_ID: ${LOCAL_RUNNER_ID:-}
  LOCAL_RUNNER_ALLOWED_PROJECT_IDS: ${LOCAL_RUNNER_ALLOWED_PROJECT_IDS:-}
  LOCAL_RUNNER_ALLOWED_REPOSITORIES: ${LOCAL_RUNNER_ALLOWED_REPOSITORIES:-}
  LOCAL_RUNNER_TOKEN_FILE: ${LOCAL_RUNNER_TOKEN_FILE:-/run/secrets/local-runner-token}
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-}
  GITHUB_LOGIN_CALLBACK_URL: ${GITHUB_LOGIN_CALLBACK_URL:-}
  GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID:-}
  GITHUB_LOGIN_CLIENT_SECRET_FILE: ${GITHUB_LOGIN_CLIENT_SECRET_FILE:-/run/secrets/github-login-client-secret}
  GITHUB_LOGIN_ALLOWED_USER_IDS: ${GITHUB_LOGIN_ALLOWED_USER_IDS:-}
  AUTH_SESSION_SECRET_FILE: ${AUTH_SESSION_SECRET_FILE:-/run/secrets/auth-session-secret}
  PUBLIC_SHARING_ENABLED: ${PUBLIC_SHARING_ENABLED:-false}
  SHARE_SIGNING_KEY_FILE: ${SHARE_SIGNING_KEY_FILE:-}

x-app-build: &app-build
  context: .
  dockerfile: infra/compose/Dockerfile
  target: runtime

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: fai_control_plane
      POSTGRES_USER: fai
      POSTGRES_PASSWORD: fai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fai -d fai_control_plane",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: *app-build
    command: ["node", "packages/db/dist/migrate.js"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: *app-build
    command: ["node", "apps/web/.next/standalone/apps/web/server.js"]
    environment:
      <<: *runtime-environment
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${GITHUB_WEBHOOK_SECRET_HOST_FILE:-./infra/compose/secrets/github-webhook.disabled}
        target: ${GITHUB_WEBHOOK_SECRET_FILE:-/run/secrets/github-webhook}
        read_only: true
      - type: bind
        source: ${TELEGRAM_WEBHOOK_SECRET_HOST_FILE:-./infra/compose/secrets/telegram-webhook.disabled}
        target: ${TELEGRAM_WEBHOOK_SECRET_FILE:-/run/secrets/telegram-webhook}
        read_only: true
      - type: bind
        source: ${TELEGRAM_IDENTITY_SECRET_HOST_FILE:-./infra/compose/secrets/telegram-identity.disabled}
        target: ${TELEGRAM_IDENTITY_SECRET_FILE:-/run/secrets/telegram-identity}
        read_only: true
      - type: bind
        source: ${GITHUB_LOGIN_CLIENT_SECRET_HOST_FILE:-./infra/compose/secrets/github-login-client-secret.disabled}
        target: ${GITHUB_LOGIN_CLIENT_SECRET_FILE:-/run/secrets/github-login-client-secret}
        read_only: true
      - type: bind
        source: ${AUTH_SESSION_SECRET_HOST_FILE:-./infra/compose/secrets/auth-session-secret.disabled}
        target: ${AUTH_SESSION_SECRET_FILE:-/run/secrets/auth-session-secret}
        read_only: true
      - type: bind
        source: ${LOCAL_RUNNER_TOKEN_HOST_FILE:-./infra/compose/secrets/local-runner-token.disabled}
        target: ${LOCAL_RUNNER_TOKEN_FILE:-/run/secrets/local-runner-token}
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    build: *app-build
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      <<: *runtime-environment
      PORT: "3001"
    ports:
      - "${WORKER_PORT:-3001}:3001"
    volumes:
      - artifacts:/var/lib/fai/artifacts
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_HOST_FILE:-./infra/compose/secrets/github-app-private-key.disabled}
        target: ${GITHUB_APP_PRIVATE_KEY_FILE:-/run/secrets/github-app-private-key}
        read_only: true
      - type: bind
        source: ${TELEGRAM_IDENTITY_SECRET_HOST_FILE:-./infra/compose/secrets/telegram-identity.disabled}
        target: ${TELEGRAM_IDENTITY_SECRET_FILE:-/run/secrets/telegram-identity}
        read_only: true
      - type: bind
        source: ${TELEGRAM_BOT_TOKEN_HOST_FILE:-./infra/compose/secrets/telegram-bot-token.disabled}
        target: ${TELEGRAM_BOT_TOKEN_FILE:-/run/secrets/telegram-bot-token}
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  artifacts:
