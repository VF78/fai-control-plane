name: fai-hermes-ascon

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    image: ${HERMES_IMAGE:?required}
    build:
      context: ../..
      dockerfile: infra/hermes-ascon/Dockerfile
    user: "10000:10000"
    working_dir: /opt/data/work/project
    entrypoint: ["/opt/hermes/bin/hermes"]
    command: ["gateway", "run"]
    env_file:
      - ${HERMES_API_SECRET_ENV_FILE:?required}
      - ${HERMES_TELEGRAM_SECRET_ENV_FILE:?required}
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      HERMES_DASHBOARD: "0"
      HERMES_GATEWAY_NO_SUPERVISE: "1"
      HERMES_PROVIDER: openai-codex
      HERMES_MODEL: ${HERMES_MODEL:?required}
      CODEX_HOME: /opt/data/codex-home
      HOME: /opt/data
      FCP_CONVERSATION_ACTION_URL: ${FCP_CONVERSATION_ACTION_URL:?required}
      TELEGRAM_ALLOWED_USERS: ${HERMES_TELEGRAM_ALLOWED_USERS:?required}
      TELEGRAM_ALLOWED_CHATS: ${HERMES_TELEGRAM_CHAT_ID:?required}
      TELEGRAM_GROUP_ALLOWED_USERS: ${HERMES_TELEGRAM_ALLOWED_USERS:?required}
      TELEGRAM_GROUP_ALLOWED_CHATS: ${HERMES_TELEGRAM_CHAT_ID:?required}
    volumes:
      - /var/lib/fai-hermes-ascon:/opt/data
      # Hide the separately mounted Codex credential from Hermes/terminal.
      - /var/lib/fai-hermes-ascon/codex-home-mask:/opt/data/codex-home:ro
      - /var/lib/fai-hermes-ascon/repository-broker:/run/fai-repository-broker
      - /var/lib/fai-hermes-ascon/executor-broker:/run/fai-executor-broker
      - ${HERMES_RENDERED_CONFIG_FILE:?required}:/opt/data/config.yaml:ro
      - ./extensions/fai-control-plane:/opt/data/plugins/fai-control-plane:ro
      - ./extensions/fai-identity:/opt/data/hooks/fai-identity:ro
      - ./profiles/internal/config.yaml:/opt/data/profiles/internal/config.yaml:ro
      - ./profiles/bitrix-client/config.yaml:/opt/data/profiles/bitrix-client/config.yaml:ro
      - ${HERMES_INTERNAL_BRIDGE_TOKEN_FILE:?required}:/opt/data/profiles/internal/bridge-token:ro
      - ${HERMES_CLIENT_BRIDGE_TOKEN_FILE:?required}:/opt/data/profiles/bitrix-client/bridge-token:ro
    ports:
      - "127.0.0.1:13020:8642"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    shm_size: 1g
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *bounded-logging

  repository-broker:
    profiles: [repository-work]
    image: fai-repository-broker:${FCP_REPOSITORY_BROKER_RELEASE:-disabled}
    build:
      context: ../..
      dockerfile: infra/repository-broker/Dockerfile
    user: "10000:10000"
    environment:
      FCP_REPOSITORY_AUTHORIZATION_URL: ${FCP_REPOSITORY_AUTHORIZATION_URL:?required}
      FCP_REPOSITORY_BRIDGE_TOKEN_FILE: /run/secrets/internal-bridge-token
      FCP_GITHUB_APP_ID: ${FCP_GITHUB_APP_ID:-0}
      FCP_GITHUB_APP_INSTALLATION_ID: ${FCP_GITHUB_APP_INSTALLATION_ID:-0}
      FCP_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-private-key.pem
      FCP_REPOSITORY_WORK_ROOT: /opt/data/work/project
      FCP_REPOSITORY_BROKER_STATE_ROOT: /var/lib/fai-repository-broker
      FCP_REPOSITORY_BROKER_SOCKET: /run/fai-repository-broker/broker.sock
    volumes:
      - /var/lib/fai-hermes-ascon/work/project:/opt/data/work/project
      - /var/lib/fai-hermes-ascon/repository-broker:/run/fai-repository-broker
      - /var/lib/fai-repository-broker-ascon:/var/lib/fai-repository-broker
      - ${HERMES_INTERNAL_BRIDGE_TOKEN_FILE:?required}:/run/secrets/internal-bridge-token:ro
      - ${FCP_GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('node:net').connect('/run/fai-repository-broker/broker.sock');n.on('connect',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 64
    init: true
    restart: unless-stopped
    logging: *bounded-logging

  executor-broker:
    profiles: [repository-work]
    image: ${HERMES_IMAGE:?required}
    user: "10000:10000"
    working_dir: /opt/data/work/project
    entrypoint: ["node", "/opt/fai/executor-broker.mjs"]
    environment:
      CODEX_HOME: /opt/data/codex-home
      HOME: /opt/data
      FCP_EXECUTOR_BROKER_SOCKET: /run/fai-executor-broker/broker.sock
      FCP_EXECUTOR_ATTESTATION_PRIVATE_KEY_FILE: /run/secrets/executor-attestation-private-key.pem
    volumes:
      - /var/lib/fai-codex-ascon/home:/opt/data/codex-home
      - /var/lib/fai-hermes-ascon/work/project:/opt/data/work/project
      - /var/lib/fai-hermes-ascon/executor-broker:/run/fai-executor-broker
      - ${FCP_EXECUTOR_ATTESTATION_PRIVATE_KEY_FILE:-/dev/null}:/run/secrets/executor-attestation-private-key.pem:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('node:net').connect('/run/fai-executor-broker/broker.sock');n.on('connect',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    init: true
    restart: unless-stopped
    logging: *bounded-logging

  codex-cli:
    image: ${HERMES_IMAGE:?required}
    build:
      context: ../..
      dockerfile: infra/hermes-ascon/Dockerfile
    user: "10000:10000"
    working_dir: /opt/data/work/project
    entrypoint: ["codex"]
    command: ["--version"]
    environment:
      CODEX_HOME: /opt/data/codex-home
      HOME: /opt/data
    volumes:
      - /var/lib/fai-codex-ascon/home:/opt/data/codex-home
      - /var/lib/fai-hermes-ascon/work/project:/opt/data/work/project
    init: true
    restart: "no"
    logging: *bounded-logging
