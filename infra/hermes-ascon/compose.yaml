name: fai-hermes-ascon

services:
  gateway:
    image: ${HERMES_IMAGE:?required}
    command: ["gateway", "run"]
    env_file:
      - ${HERMES_API_SECRET_ENV_FILE:?required}
      - ${HERMES_TELEGRAM_SECRET_ENV_FILE:?required}
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      HERMES_DASHBOARD: "0"
      HERMES_GATEWAY_NO_SUPERVISE: "1"
      HERMES_PROVIDER: openai-codex
      HERMES_MODEL: ${HERMES_MODEL:?required}
      FCP_CONVERSATION_ACTION_URL: ${FCP_CONVERSATION_ACTION_URL:?required}
      TELEGRAM_ALLOWED_USERS: ${HERMES_TELEGRAM_ALLOWED_USERS:?required}
      TELEGRAM_ALLOWED_CHATS: ${HERMES_TELEGRAM_CHAT_ID:?required}
      TELEGRAM_GROUP_ALLOWED_USERS: ${HERMES_TELEGRAM_ALLOWED_USERS:?required}
      TELEGRAM_GROUP_ALLOWED_CHATS: ${HERMES_TELEGRAM_CHAT_ID:?required}
    volumes:
      - /var/lib/fai-hermes-ascon:/opt/data
      - ${HERMES_RENDERED_CONFIG_FILE:?required}:/opt/data/config.yaml:ro
      - ./extensions/fai-control-plane:/opt/data/plugins/fai-control-plane:ro
      - ./extensions/fai-identity:/opt/data/hooks/fai-identity:ro
      - ./profiles/internal/config.yaml:/opt/data/profiles/internal/config.yaml:ro
      - ./profiles/bitrix-client/config.yaml:/opt/data/profiles/bitrix-client/config.yaml:ro
      - ${HERMES_INTERNAL_BRIDGE_TOKEN_FILE:?required}:/opt/data/profiles/internal/bridge-token:ro
      - ${HERMES_CLIENT_BRIDGE_TOKEN_FILE:?required}:/opt/data/profiles/bitrix-client/bridge-token:ro
    ports:
      - "127.0.0.1:13020:8642"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    shm_size: 1g
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
