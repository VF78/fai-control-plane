name: fai-hermes-ascon

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    image: ${HERMES_IMAGE:?required}
    build:
      context: ../..
      dockerfile: infra/hermes-ascon/Dockerfile
    user: "10000:10000"
    working_dir: /opt/data/work/project
    entrypoint: ["/opt/fai/native-entrypoint.sh"]
    command: ["gateway", "run"]
    env_file:
      - ${HERMES_API_SECRET_ENV_FILE:?required}
      - ${HERMES_TELEGRAM_SECRET_ENV_FILE:?required}
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      HERMES_DASHBOARD: "0"
      HERMES_GATEWAY_NO_SUPERVISE: "1"
      HERMES_PROVIDER: openai-codex
      HERMES_MODEL: ${HERMES_MODEL:?required}
      TERMINAL_MAX_FOREGROUND_TIMEOUT: "1800"
      CODEX_HOME: /opt/data/codex-home
      HERMES_GITHUB_REPOSITORY_TOKEN_FILE: /run/secrets/github-repository-token
      HERMES_DEVOPS_SSH_HOST: ${HERMES_DEVOPS_SSH_HOST:?required}
      HERMES_DEVOPS_SSH_USER: ${HERMES_DEVOPS_SSH_USER:?required}
      HERMES_DEVOPS_SSH_PORT: ${HERMES_DEVOPS_SSH_PORT:-22}
      HERMES_DEVOPS_SSH_IDENTITY_FILE: /opt/fai-devops/ssh/identity
      HERMES_DEVOPS_SSH_KNOWN_HOSTS_FILE: /opt/fai-devops/ssh/known_hosts
      HOME: /opt/data
      FCP_CONVERSATION_ACTION_URL: ${FCP_CONVERSATION_ACTION_URL:?required}
      TELEGRAM_ALLOWED_USERS: ${HERMES_TELEGRAM_ALLOWED_USERS:?required}
      TELEGRAM_ALLOWED_CHATS: ${HERMES_TELEGRAM_CHAT_ID:?required}
      TELEGRAM_GROUP_ALLOWED_USERS: ${HERMES_TELEGRAM_ALLOWED_USERS:?required}
      TELEGRAM_GROUP_ALLOWED_CHATS: ${HERMES_TELEGRAM_CHAT_ID:?required}
    volumes:
      - /var/lib/fai-hermes-ascon:/opt/data
      - /var/lib/fai-codex-ascon/home:/opt/data/codex-home
      - ${HERMES_GITHUB_REPOSITORY_TOKEN_FILE:?required}:/run/secrets/github-repository-token:ro
      - ${HERMES_DEVOPS_SSH_IDENTITY_FILE:?required}:/opt/fai-devops/ssh/identity:ro
      - ${HERMES_DEVOPS_SSH_KNOWN_HOSTS_FILE:?required}:/opt/fai-devops/ssh/known_hosts:ro
      - ${HERMES_DEVOPS_YC_CONFIG_FILE:?required}:/opt/data/.config/yandex-cloud/config.yaml:ro
      - ${HERMES_RENDERED_CONFIG_FILE:?required}:/opt/data/config.yaml:ro
      - ./extensions/fai-control-plane:/opt/data/plugins/fai-control-plane:ro
      - ./extensions/fai-identity:/opt/data/hooks/fai-identity:ro
      - ./profile-template:/opt/data/profiles/fai-project-template:ro
      - ./profiles/internal/config.yaml:/opt/data/profiles/internal/config.yaml:ro
      - ./profiles/bitrix-client/config.yaml:/opt/data/profiles/bitrix-client/config.yaml:ro
      - ${HERMES_INTERNAL_BRIDGE_TOKEN_FILE:?required}:/opt/data/profiles/internal/bridge-token:ro
      - ${HERMES_CLIENT_BRIDGE_TOKEN_FILE:?required}:/opt/data/profiles/bitrix-client/bridge-token:ro
    networks:
      default:
      management:
        aliases:
          - hermes-gateway
    ports:
      - "127.0.0.1:13020:8642"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    shm_size: 1g
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *bounded-logging

  dashboard:
    image: ${HERMES_IMAGE:?required}
    build:
      context: ../..
      dockerfile: infra/hermes-ascon/Dockerfile
    user: "10000:10000"
    working_dir: /opt/data
    entrypoint: ["/opt/fai/management-entrypoint.sh"]
    environment:
      HOME: /opt/data
      HERMES_DASHBOARD_USERNAME_FILE: /run/secrets/hermes-dashboard-username
      HERMES_DASHBOARD_PASSWORD_FILE: /run/secrets/hermes-dashboard-password
      HERMES_DASHBOARD_SIGNING_SECRET_FILE: /run/secrets/hermes-dashboard-signing-secret
    volumes:
      - /var/lib/fai-hermes-ascon:/opt/data
      - ${HERMES_RENDERED_CONFIG_FILE:?required}:/opt/data/config.yaml:ro
      - ./profile-template:/opt/data/profiles/fai-project-template:ro
      - ${HERMES_DASHBOARD_USERNAME_FILE:?required}:/run/secrets/hermes-dashboard-username:ro
      - ${HERMES_DASHBOARD_PASSWORD_FILE:?required}:/run/secrets/hermes-dashboard-password:ro
      - ${HERMES_DASHBOARD_SIGNING_SECRET_FILE:?required}:/run/secrets/hermes-dashboard-signing-secret:ro
    networks:
      management:
        aliases:
          - hermes-dashboard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: "0.25"
    mem_limit: 384m
    pids_limit: 128
    init: true
    restart: unless-stopped
    logging: *bounded-logging

  codex-cli:
    image: ${HERMES_IMAGE:?required}
    build:
      context: ../..
      dockerfile: infra/hermes-ascon/Dockerfile
    user: "10000:10000"
    working_dir: /opt/data/work/project
    entrypoint: ["codex"]
    command: ["--version"]
    environment:
      CODEX_HOME: /opt/data/codex-home
      HOME: /opt/data
    volumes:
      - /var/lib/fai-codex-ascon/home:/opt/data/codex-home
      - /var/lib/fai-hermes-ascon/work/project:/opt/data/work/project
    init: true
    restart: "no"
    logging: *bounded-logging

networks:
  management:
    name: fai-hermes-management
    external: true
