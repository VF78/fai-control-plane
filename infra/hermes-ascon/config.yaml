_config_version: 34

model:
  provider: openai-codex
  default: __HERMES_MODEL__

# Hermes v2026.8.13: never use a paid OpenRouter auxiliary model.
auxiliary:
  free_only: true

terminal:
  backend: local
  cwd: /opt/data/work

# API role-runs are a thin control loop around one configured executor. Keep
# Telegram profiles independent; they retain their own conversational tools.
platform_toolsets:
  api_server:
    - terminal
    - no_mcp

agent:
  max_turns: 12

toolsets:
  - file
  - terminal
  - search
  - web
  - skills
  - todo
  - memory
  - session_search
  - clarify

plugins:
  enabled:
    - fai-control-plane

gateway:
  multiplex_profiles: true
  multiplex_profile_allowlist:
    - internal
    - bitrix-client
  profile_routes:
    - name: ascon-internal
      platform: telegram
      chat_id: "-5540760630"
      profile: internal

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
