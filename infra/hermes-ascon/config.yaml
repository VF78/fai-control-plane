model:
  provider: openai-codex
  default: ${HERMES_MODEL}

terminal:
  backend: local
  cwd: /opt/data/work

toolsets:
  - file
  - terminal
  - search
  - web
  - skills
  - todo
  - memory
  - session_search
  - clarify

plugins:
  enabled:
    - fai-control-plane

gateway:
  multiplex_profiles: true
  multiplex_profile_allowlist:
    - internal
    - bitrix-client
  profile_routes:
    - name: ascon-internal
      platform: telegram
      chat_id: "-5540760630"
      profile: internal

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
