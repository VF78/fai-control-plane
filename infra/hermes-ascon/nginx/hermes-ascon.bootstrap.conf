# Temporary HTTP-only bootstrap for the first ACME certificate. Replace with
# hermes-ascon.f-ai.studio.conf immediately after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name hermes-ascon.f-ai.studio;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / { return 404; }
}
