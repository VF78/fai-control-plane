upstream fai_hermes_ascon {
    server 127.0.0.1:13020;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name hermes-ascon.f-ai.studio;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / { return 308 https://hermes-ascon.f-ai.studio$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hermes-ascon.f-ai.studio;

    ssl_certificate /etc/letsencrypt/live/hermes-ascon.f-ai.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes-ascon.f-ai.studio/privkey.pem;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://fai_hermes_ascon/health;
        proxy_set_header Host $host;
    }

    location = /v1/runs {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        proxy_pass http://fai_hermes_ascon/v1/runs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location ~ "^/v1/runs/run_[A-Za-z0-9_-]{1,250}$" {
        limit_except GET { deny all; }
        proxy_pass http://fai_hermes_ascon$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /v1/capabilities {
        limit_except GET { deny all; }
        proxy_pass http://fai_hermes_ascon/v1/capabilities;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}
