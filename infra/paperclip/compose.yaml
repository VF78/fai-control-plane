name: fai-paperclip
services:
  postgres:
    image: ${FCP_POSTGRES_IMAGE:?Set approved postgres image digest}
    container_name: fai-paperclip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - /var/lib/paperclip/postgres:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  postgres-password:
    file: /etc/fai-paperclip/secrets/postgres-password
