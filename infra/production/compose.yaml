name: fai-control-plane-production

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL}
  OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  GITHUB_SYNC_ENABLED: ${GITHUB_SYNC_ENABLED}
  GITHUB_INGRESS_ENABLED: ${GITHUB_INGRESS_ENABLED}
  GITHUB_STATUS_WRITEBACK_ENABLED: ${GITHUB_STATUS_WRITEBACK_ENABLED}
  GITHUB_PROJECTS_OAUTH_TOKEN_FILE: /run/secrets/github-projects-oauth-token
  GITHUB_APP_ID: ${GITHUB_APP_ID}
  GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-private-key
  GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github-webhook
  FCP_WORKSPACE_ID: ${FCP_WORKSPACE_ID}
  FCP_OPERATOR_GITHUB_USER_IDS: ${FCP_OPERATOR_GITHUB_USER_IDS}
  FCP_BOOTSTRAP_HUMAN_SUBJECT: ${FCP_BOOTSTRAP_HUMAN_SUBJECT}
  GITHUB_MSA_PROJECT_ID: ${GITHUB_MSA_PROJECT_ID}
  GITHUB_MSA_INSTALLATION_ID: ${GITHUB_MSA_INSTALLATION_ID}
  GITHUB_ASCON_PROJECT_ID: ${GITHUB_ASCON_PROJECT_ID}
  GITHUB_ASCON_INSTALLATION_ID: ${GITHUB_ASCON_INSTALLATION_ID}
  TELEGRAM_INGRESS_ENABLED: ${TELEGRAM_INGRESS_ENABLED}
  TELEGRAM_STATUS_RESPONSE_ENABLED: ${TELEGRAM_STATUS_RESPONSE_ENABLED}
  TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram-webhook
  TELEGRAM_IDENTITY_SECRET_FILE: /run/secrets/telegram-identity
  TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
  TELEGRAM_MSA_PROJECT_ID: ${TELEGRAM_MSA_PROJECT_ID}
  TELEGRAM_ASCON_PROJECT_ID: ${TELEGRAM_ASCON_PROJECT_ID}
  TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
  TELEGRAM_ALLOWED_PRIVATE_CHAT_IDS: ${TELEGRAM_ALLOWED_PRIVATE_CHAT_IDS}
  RUNNER_ENABLED: ${RUNNER_ENABLED}
  HERMES_RUNNER_ENABLED: ${HERMES_RUNNER_ENABLED}
  ARTIFACTS_ROOT: /var/lib/fai/artifacts
  LOCAL_RUNNER_TRANSPORT_ENABLED: ${LOCAL_RUNNER_TRANSPORT_ENABLED}
  LOCAL_RUNNER_WORKSPACE_ID: ${LOCAL_RUNNER_WORKSPACE_ID}
  LOCAL_RUNNER_ID: ${LOCAL_RUNNER_ID}
  LOCAL_RUNNER_ALLOWED_PROJECT_IDS: ${LOCAL_RUNNER_ALLOWED_PROJECT_IDS}
  LOCAL_RUNNER_ALLOWED_REPOSITORIES: ${LOCAL_RUNNER_ALLOWED_REPOSITORIES}
  LOCAL_RUNNER_ALLOWED_RUNTIME_IDS: ${LOCAL_RUNNER_ALLOWED_RUNTIME_IDS}
  LOCAL_RUNNER_TOKEN_FILE: /run/secrets/local-runner-token
  AUTH_ENABLED: ${AUTH_ENABLED}
  AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL}
  GITHUB_LOGIN_CALLBACK_URL: ${GITHUB_LOGIN_CALLBACK_URL}
  GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID}
  GITHUB_LOGIN_CLIENT_SECRET_FILE: /run/secrets/github-login-client-secret
  AUTH_SESSION_SECRET_FILE: /run/secrets/auth-session-secret
  PUBLIC_SHARING_ENABLED: ${PUBLIC_SHARING_ENABLED}
  SHARE_SIGNING_KEY_FILE: /run/secrets/share-signing-key

x-app-image: &app-image
  image: fai-control-plane:${FCP_IMAGE_TAG}
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
    target: runtime

x-database-url-volume: &database-url-volume
  type: bind
  source: ${DATABASE_URL_HOST_FILE}
  target: /run/secrets/database-url
  read_only: true

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${POSTGRES_PASSWORD_HOST_FILE}
        target: /run/secrets/postgres-password
        read_only: true
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app-image
    command:
      - /bin/sh
      - -ec
      - export DATABASE_URL="$$(cat /run/secrets/database-url)"; exec node packages/db/dist/migrate.js
    environment:
      <<: *runtime-environment
    volumes:
      - *database-url-volume
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app-image
    command:
      - /bin/sh
      - -ec
      - export DATABASE_URL="$$(cat /run/secrets/database-url)"; exec node apps/worker/dist/index.js
    environment:
      <<: *runtime-environment
      PORT: "3001"
    volumes:
      - artifacts:/var/lib/fai/artifacts
      - *database-url-volume
      - type: bind
        source: ${GITHUB_PROJECTS_OAUTH_TOKEN_HOST_FILE}
        target: /run/secrets/github-projects-oauth-token
        read_only: true
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_HOST_FILE}
        target: /run/secrets/github-app-private-key
        read_only: true
      - type: bind
        source: ${TELEGRAM_IDENTITY_SECRET_HOST_FILE}
        target: /run/secrets/telegram-identity
        read_only: true
      - type: bind
        source: ${TELEGRAM_BOT_TOKEN_HOST_FILE}
        target: /run/secrets/telegram-bot-token
        read_only: true
    networks:
      - database
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    <<: *app-image
    command:
      - /bin/sh
      - -ec
      - export DATABASE_URL="$$(cat /run/secrets/database-url)"; exec node apps/web/.next/standalone/apps/web/server.js
    environment:
      <<: *runtime-environment
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_BIND_PORT}:3000"
    volumes:
      - *database-url-volume
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_HOST_FILE}
        target: /run/secrets/github-app-private-key
        read_only: true
      - type: bind
        source: ${GITHUB_PROJECTS_OAUTH_TOKEN_HOST_FILE}
        target: /run/secrets/github-projects-oauth-token
        read_only: true
      - type: bind
        source: ${GITHUB_WEBHOOK_SECRET_HOST_FILE}
        target: /run/secrets/github-webhook
        read_only: true
      - type: bind
        source: ${TELEGRAM_WEBHOOK_SECRET_HOST_FILE}
        target: /run/secrets/telegram-webhook
        read_only: true
      - type: bind
        source: ${TELEGRAM_IDENTITY_SECRET_HOST_FILE}
        target: /run/secrets/telegram-identity
        read_only: true
      - type: bind
        source: ${GITHUB_LOGIN_CLIENT_SECRET_HOST_FILE}
        target: /run/secrets/github-login-client-secret
        read_only: true
      - type: bind
        source: ${AUTH_SESSION_SECRET_HOST_FILE}
        target: /run/secrets/auth-session-secret
        read_only: true
      - type: bind
        source: ${LOCAL_RUNNER_TOKEN_HOST_FILE}
        target: /run/secrets/local-runner-token
        read_only: true
      - type: bind
        source: ${SHARE_SIGNING_KEY_HOST_FILE}
        target: /run/secrets/share-signing-key
        read_only: true
    networks:
      - database
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

networks:
  database:
    internal: true
  egress:

volumes:
  postgres-data:
    name: fai-control-plane-production-postgres-data
  artifacts:
    name: fai-control-plane-production-artifacts
