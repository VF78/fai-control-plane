name: fai-control-plane-mvp

x-app: &app
  image: fai-control-plane-mvp:${FCP_RELEASE_COMMIT:?required}
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
    target: runtime
  env_file:
    - ${FCP_RUNTIME_ENV_FILE:?required}
  user: "0:0"

x-database-environment: &database-environment
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:?required}
  PGDATABASE: ${POSTGRES_DB:?required}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "packages/db/dist/migrate.js"]
    environment: *database-environment
    secrets:
      - source: postgres-password
        target: source-postgres-password
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    <<: *app
    profiles: [bootstrap]
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "packages/db/dist/bootstrap.js"]
    environment: *database-environment
    secrets:
      - source: postgres-password
        target: source-postgres-password
    networks:
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *app
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "apps/web/.next/standalone/apps/web/server.js"]
    environment:
      <<: *database-environment
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    secrets:
      - source: postgres-password
        target: source-postgres-password
      - source: github-login-client-secret
        target: source-github-login-client-secret
      - source: github-projects-token
        target: source-github-projects-token
      - source: github-webhook-secret
        target: source-github-webhook-secret
      - source: hermes-internal-action-token
        target: source-hermes-internal-action-token
      - source: hermes-client-action-token
        target: source-hermes-client-action-token
      - source: hermes-token
        target: source-hermes-token
    networks:
      - database
      - egress
    ports:
      - "127.0.0.1:13010:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    <<: *app
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "apps/worker/dist/index.js"]
    environment:
      <<: *database-environment
      NODE_ENV: production
      PORT: "3001"
    secrets:
      - source: postgres-password
        target: source-postgres-password
      - source: github-projects-token
        target: source-github-projects-token
      - source: telegram-bot-token
        target: source-telegram-bot-token
    networks:
      - database
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  database:
    internal: true
  egress:

volumes:
  postgres-data:
    name: fai-control-plane-mvp-postgres-data

secrets:
  postgres-password:
    file: ${POSTGRES_PASSWORD_HOST_FILE:?required}
  github-login-client-secret:
    file: ${GITHUB_LOGIN_CLIENT_SECRET_HOST_FILE:?required}
  github-projects-token:
    file: ${GITHUB_PROJECTS_TOKEN_HOST_FILE:?required}
  github-webhook-secret:
    file: ${GITHUB_WEBHOOK_SECRET_HOST_FILE:?required}
  hermes-token:
    file: ${HERMES_TOKEN_HOST_FILE:?required}
  telegram-bot-token:
    file: ${TELEGRAM_BOT_TOKEN_HOST_FILE:?required}
  hermes-internal-action-token:
    file: ${HERMES_INTERNAL_ACTION_TOKEN_HOST_FILE:?required}
  hermes-client-action-token:
    file: ${HERMES_CLIENT_ACTION_TOKEN_HOST_FILE:?required}
