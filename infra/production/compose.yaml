name: fai-control-plane-mvp

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: fai-control-plane-mvp:${FCP_RELEASE_COMMIT:?required}
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
    target: runtime
  env_file:
    - ${FCP_RUNTIME_ENV_FILE:?required}
  user: "0:0"
  logging: *bounded-logging

x-database-environment: &database-environment
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:?required}
  PGDATABASE: ${POSTGRES_DB:?required}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *bounded-logging

  migrate:
    <<: *app
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "packages/db/dist/migrate.js"]
    environment: *database-environment
    secrets:
      - source: postgres-password
        target: source-postgres-password
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    <<: *app
    profiles: [bootstrap]
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "packages/db/dist/bootstrap.js"]
    environment: *database-environment
    secrets:
      - source: postgres-password
        target: source-postgres-password
    networks:
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *app
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "apps/web/.next/standalone/apps/web/server.js"]
    environment:
      <<: *database-environment
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      FCP_WORKER_INTERNAL_URL: http://worker:3001
    secrets:
      - source: postgres-password
        target: source-postgres-password
      - source: github-login-client-secret
        target: source-github-login-client-secret
      - source: github-projects-token
        target: source-github-projects-token
      - source: github-webhook-secret
        target: source-github-webhook-secret
    networks:
      - database
      - egress
      - hermes-management
    ports:
      - "127.0.0.1:13010:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    <<: *app
    entrypoint: []
    command: ["sh", "infra/compose/run-with-postgres-secret.sh", "node", "apps/worker/dist/index.js"]
    environment:
      <<: *database-environment
      NODE_ENV: production
      PORT: "3001"
      FCP_PROJECT_RUNTIME_HOST_DIR: /var/lib/fai-project-runtimes
      FCP_PROJECT_HERMES_IMAGE: fai-hermes-project:codex-0.153.4
      FCP_PROJECT_HERMES_IMAGE_ID: ${FCP_PROJECT_HERMES_IMAGE_ID:?required}
      FCP_HERMES_MANAGEMENT_NETWORK: fai-hermes-management
    secrets:
      - source: postgres-password
        target: postgres-password
      - source: github-projects-token
        target: github-projects-token
    networks:
      - database
      - egress
      - hermes-management
    volumes:
      - /var/lib/fai-project-runtimes:/var/lib/fai-project-runtimes
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  database:
    internal: true
  egress:
  hermes-management:
    name: fai-hermes-management
    external: true

volumes:
  postgres-data:
    name: fai-control-plane-mvp-postgres-data

secrets:
  postgres-password:
    file: ${POSTGRES_PASSWORD_HOST_FILE:?required}
  github-login-client-secret:
    file: ${GITHUB_LOGIN_CLIENT_SECRET_HOST_FILE:?required}
  github-projects-token:
    file: ${GITHUB_PROJECTS_TOKEN_HOST_FILE:?required}
  github-webhook-secret:
    file: ${GITHUB_WEBHOOK_SECRET_HOST_FILE:?required}
