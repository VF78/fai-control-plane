# Preparation template only. Do not install or enable without separate approval,
# a confirmed free loopback port 13000, and approved DNS/TLS changes.

map $uri $fai_safe_target {
    ~^/share/                 /share/[redacted];
    =/oauth/github/complete /oauth/github/complete;
    default                   $uri;
}

# Deliberately omits query strings and Referer, either of which can contain
# OAuth codes or share bearer URLs.
log_format fai_redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $fai_safe_target $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

# Sensitive paths use a constant target instead of any request-target variable.
log_format fai_sensitive '$remote_addr - $remote_user [$time_local] '
                         '"$request_method [sensitive-target-redacted] $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';

upstream fai_control_plane_web {
    server 127.0.0.1:13000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.f-ai.studio;

    access_log /var/log/nginx/app.f-ai.studio.access.log fai_redacted;
    return 301 https://app.f-ai.studio$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.f-ai.studio;

    ssl_certificate /etc/letsencrypt/live/app.f-ai.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.f-ai.studio/privkey.pem;

    access_log /var/log/nginx/app.f-ai.studio.access.log fai_redacted;
    error_log /var/log/nginx/app.f-ai.studio.error.log warn;

    location ^~ /share/ {
        access_log /var/log/nginx/app.f-ai.studio.access.log fai_sensitive;
        error_log /dev/null crit;
        proxy_pass http://fai_control_plane_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /oauth/github/complete {
        access_log /var/log/nginx/app.f-ai.studio.access.log fai_sensitive;
        error_log /dev/null crit;
        proxy_pass http://fai_control_plane_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://fai_control_plane_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
